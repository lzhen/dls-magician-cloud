<!doctype html><html lang="en" data-theme="dark"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Component integration fixture</title><link rel="stylesheet" href="../public/component-preview.css"><style>
*{box-sizing:border-box}body{margin:0;background:#15161b;color:#f4f4f7;font:14px system-ui}header{display:flex;flex-wrap:wrap;gap:12px;padding:16px;border-bottom:1px solid #444}header select,header button{padding:8px}main{display:grid;grid-template-columns:320px minmax(0,1fr);min-height:600px}aside{padding:16px;border-right:1px solid #444}textarea{display:block;width:100%;height:85px;background:#202128;color:#eee;border:1px solid #555;margin:8px 0 16px;padding:10px}article{min-width:0}.output-system-summary{padding:16px;border-bottom:1px solid #333}pre{white-space:pre-wrap;overflow-wrap:anywhere;padding:16px}.modal{padding:24px;border-top:1px solid #444}@media(max-width:600px){main{display:block}aside{display:none}}
</style></head><body><header><select id="system"><option value="dls">DLS Magician</option><option value="ant">Ant Design</option><option value="material">Material UI</option><option value="connected">Connected reference</option></select><select id="mode"><option value="interface">Interface</option><option value="json">JSON</option><option value="flow">Logic flow</option></select><button id="expand">Expand</button><button id="theme">Theme</button></header><main><aside><label>GIVEN<textarea id="given">a button</textarea></label><label>WHEN<textarea id="when"></textarea></label><label>THEN<textarea id="then"></textarea></label><div id="validation-state"></div></aside><article><div class="output-system-summary"></div><div id="generated-preview"></div></article></main><div id="modal-root"></div>
<script>
// Integration fixture: the parser and output dispatch below mirror the app.js functions read from the production branch.
const state={activeProject:{name:'Omnichannel campaign'},editorText:'GIVEN\na button\n\nWHEN\n\nTHEN\n',designSystem:'dls',previewMode:'interface'};
const DESIGN_SYSTEMS={dls:{name:'DLS Magician',source:'Built-in'},material:{name:'Material UI',source:'Built-in'},ant:{name:'Ant Design',source:'Built-in'},connected:{name:'Connected reference',source:'MCP'}};
function designSystemComponents(){const components={dls:['Surface','Status card','Select field','Inline insight','Button'],material:['Paper','Card','List','Select','Alert','Button'],ant:['Layout','Card','List','Select','Alert','Button'],connected:['Surface','Card','Field','Message','Button']};return components[state.designSystem]||components.dls;}
function generatedOutput(generated){const system=DESIGN_SYSTEMS[state.designSystem];return {...generated,designSystem:{id:state.designSystem,name:system.name,source:system.source,components:designSystemComponents()}};}
function parseStructuredLanguage(text,name='Untitled workflow'){
 const lines=String(text||'').replace(/\r/g,'').split('\n');const steps=[];let current=null;
 for(const raw of lines){const line=raw.trim();if(!line)continue;const upper=line.toUpperCase();if(['GIVEN','WHEN','THEN','AND'].includes(upper)){current={type:upper,text:''};steps.push(current);}else if(current){current.text+=`${current.text?' ':''}${line}`;}}
 const entityMatches=steps.flatMap(step=>step.text.match(/\b(?:advertiser|campaign|offline data|signals?|performance|insights?|dataset|audience|pixel|workflow)\b/gi)||[]);const entities=[...new Set(entityMatches.map(value=>value.toLowerCase()))];
 return {intent:name,version:'1.0',steps:steps.map((step,index)=>({id:`step_${index+1}`,type:step.type,text:step.text,entities:entities.filter(entity=>step.text.toLowerCase().includes(entity))})),entities,valid:['GIVEN','WHEN','THEN'].every(type=>steps.some(step=>step.type===type&&step.text))};
}
function escapeHtml(v){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}
function highlightJson(value){return escapeHtml(JSON.stringify(value,null,2));}
function renderFlow(steps){return steps.map(step=>`<p>${escapeHtml(step.type)}: ${escapeHtml(step.text)}</p>`).join('');}
function renderGeneratedInterface(){return '<section class="legacy-workflow">Legacy workflow fallback</section>';}
function renderOutput(generated){if(state.previewMode==='json')return `<div class="json-view"><pre class="json-code" id="json-code">${highlightJson(generatedOutput(generated))}</pre></div>`;if(state.previewMode==='flow')return `<div class="flow-view"><div class="flow-canvas">${renderFlow(generated.steps)}</div></div>`;return renderGeneratedInterface(generated);}
function renderPreviewModal(){const parsed=parseStructuredLanguage(state.editorText,state.activeProject?.name||'Workflow');return `<section class="modal"><div id="preview-description"></div>${renderGeneratedInterface(parsed,true)}</section>`;}
function updateEditorOutputs(){const parsed=parseStructuredLanguage(state.editorText,state.activeProject.name);document.getElementById('generated-preview').innerHTML=renderOutput(parsed);document.getElementById('validation-state').textContent=parsed.valid?'Valid':'Needs input';}
function setIntent(given,when='',then=''){document.getElementById('given').value=given;document.getElementById('when').value=when;document.getElementById('then').value=then;state.editorText=`GIVEN\n${given}\n\nWHEN\n${when}\n\nTHEN\n${then}`;updateEditorOutputs();}
document.querySelectorAll('aside textarea').forEach(el=>el.addEventListener('input',()=>setIntent(document.getElementById('given').value,document.getElementById('when').value,document.getElementById('then').value)));
document.getElementById('system').addEventListener('change',e=>{state.designSystem=e.target.value;updateEditorOutputs();});
document.getElementById('mode').addEventListener('change',e=>{state.previewMode=e.target.value;updateEditorOutputs();});
document.getElementById('expand').addEventListener('click',()=>document.getElementById('modal-root').innerHTML=renderPreviewModal());
document.getElementById('theme').addEventListener('click',()=>document.documentElement.dataset.theme=document.documentElement.dataset.theme==='light'?'dark':'light');
</script><script src="../public/component-preview.js"></script></body></html>
