<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DLS Magician — Behavior Lab</title><link rel="stylesheet" href="/component-preview.css?v=behavior-runtime-3"><style>
body{margin:0;background:#14151a;color:#eee;font:15px system-ui}main{max-width:1000px;margin:40px auto;padding:0 24px}h1{font-size:24px}a{color:#b6a5ff}select,button{padding:10px;background:#252631;color:white;border:1px solid #555;border-radius:6px}select{max-width:100%;min-width:350px}pre{white-space:pre-wrap;background:#20212a;padding:20px;line-height:1.7;border-radius:8px}#preview{min-height:250px}.component-preview{min-height:230px;border-radius:8px}#expected{color:#c9bfdc}small{color:#aaa}</style></head><body><main><h1>Software behavior lab</h1><p>Executable interface actions and clearly marked simulations. <a href="/#project/p-omnichannel">Back to original editor</a></p><label for="scenario">Choose a behavior</label><p><select id="scenario"></select> <button id="reset">Reset demo</button></p><p id="expected"></p><pre id="intent"></pre><div id="preview"></div><p><small>Backend operations and navigation are simulated. No real data is saved, deleted, sent, or downloaded.</small></p></main><script src="/interaction-engine.js?v=behavior-runtime-3"></script><script src="/component-preview.js?v=behavior-runtime-3"></script><script src="/behavior-scenarios.js?v=behavior-runtime-3"></script><script>
const picker=document.getElementById('scenario');
DLSBehaviorScenarios.forEach((s,i)=>{const option=document.createElement('option');option.value=i;option.textContent=s.name;picker.append(option);});
function render(){const s=DLSBehaviorScenarios[picker.value];document.getElementById('intent').textContent=s.steps.map(step=>step.type+' '+step.text).join('\n');document.getElementById('expected').textContent=s.expected;document.getElementById('preview').innerHTML=DLSComponentPreview.render({steps:s.steps});}
picker.addEventListener('change',render);document.getElementById('reset').addEventListener('click',render);
DLSComponentPreview.bindEvents(document);DLSInteractions.bind(document);render();
</script></body></html>
