name: Resolve DLS Swift Packages
on:
  push:
    branches: [fix/dls-xcode-cloud-readiness-20261004]
    paths:
      - '.github/workflows/resolve-dls-packages.yml'
permissions:
  contents: write
jobs:
  resolve:
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/dls-xcode-cloud-readiness-20261004
      - uses: actions/setup-node@v4
        with: {node-version: '22'}
      - uses: maxim-lobanov/setup-xcode@v1
        with: {xcode-version: latest-stable}
      - run: npm install --prefix mobile --no-audit --no-fund
      - run: cd mobile && npx cap sync ios
      - name: Resolve Swift packages
        run: |
          cd mobile
          xcodebuild -resolvePackageDependencies -project ios/App/App.xcodeproj -scheme "DLS Magician"
          test -s ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
      - name: Commit Package.resolved
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f mobile/ios/App/App.xcodeproj/project.xcworkspace/xcshareddata/swiftpm/Package.resolved
          git commit -m "ios: commit DLS Swift package resolution" || exit 0
          git push origin HEAD:fix/dls-xcode-cloud-readiness-20261004