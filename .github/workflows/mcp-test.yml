name: DLS Magician MCP

on:
  pull_request:
    paths:
      - 'mcp/**'
      - 'public/app.js'
      - 'public/styles.css'
      - 'package.json'
      - '.github/workflows/mcp-test.yml'
  push:
    branches: [main]
    paths:
      - 'mcp/**'
      - 'public/app.js'
      - 'public/styles.css'
      - 'package.json'
      - '.github/workflows/mcp-test.yml'

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: mcp/package-lock.json
      - run: npm run mcp:setup
      - run: npm run test:mcp
      - run: npm run demo:mcp
      - run: npm run showcase:mcp
      - run: node --check mcp/showcase/showcase.js
